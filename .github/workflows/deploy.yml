name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-app-repo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python & Install Dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3. Test (pytest Gate)
      - name: Run Pytest
        run: pytest

      # 4. AWS Authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build & Push Docker Image
      - name: Build & Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 6. Deploy to EC2 & Health Check Gate
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REGISTRY="${{ steps.login_ecr.outputs.registry }}"

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            docker stop flask-app || true
            docker rm flask-app || true

            docker run -d --name flask-app -p 5000:5000 $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            sleep 5
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            if [ "$HEALTH_STATUS" -ne 200 ]; then
              echo "Health check failed with status $HEALTH_STATUS"
              exit 1
            fi
            echo "Health check passed!"

      # 7. Email Notification - SUCCESS
      - name: Send Success Email
  if: success()
  uses: dawidd6/action-send-mail@v3
  with:
    server_address: smtp.gmail.com
    server_port: 587
    username: ${{ secrets.SMTP_USER }}
    password: ${{ secrets.SMTP_PASS }}
    from: ${{ secrets.SMTP_USER }}
    to: ${{ secrets.NOTIFY_EMAIL }}
    subject: "Pipeline Success"
    body: |
      The CI/CD pipeline completed successfully.

      Build Details:
      - Commit SHA: ${{ github.sha }}
      - Branch: ${{ github.ref_name }}
      - Docker Image Tag: ${{ github.sha }}
      - Target EC2 Host: ${{ secrets.EC2_HOST }}
      - Pipeline Run Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 8. Email Notification - FAILURE
      - name: Send Failure Email
  if: failure()
  uses: dawidd6/action-send-mail@v3
  with:
    server_address: smtp.gmail.com
    server_port: 587
    username: ${{ secrets.SMTP_USER }}
    password: ${{ secrets.SMTP_PASS }}
    from: ${{ secrets.SMTP_USER }}
    to: ${{ secrets.NOTIFY_EMAIL }}
    subject: "Pipeline Failed"
    body: |
      The CI/CD pipeline has failed.

      Failure Summary:
      - Commit SHA: ${{ github.sha }}
      - Branch: ${{ github.ref_name }}
      - Pipeline Run Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
